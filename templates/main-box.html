<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiliDownloader - 首页</title>

  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide 图标库 -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* 隐藏滚动条，保持界面纯净 */
    body::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex h-screen w-full bg-white text-zinc-800 antialiased overflow-hidden font-sans">

  <!-- ================= 左侧边栏 ================= -->
  <!-- 宽度 64px，浅灰色背景，右侧边框 -->
  <aside class="w-[64px] h-full bg-[#f4f4f5] border-r border-zinc-200 flex flex-col items-center py-4 shrink-0 z-10">

    <!-- 头像 -->
    <div class="w-9 h-9 rounded-full bg-zinc-200 border border-zinc-300 mb-8 bg-cover bg-center cursor-pointer hover:ring-2 hover:ring-emerald-400 transition-all"
         style="background-image: url('https://picsum.photos/100/100?random=1');"></div>

    <!-- 导航图标 -->
    <nav class="flex flex-col gap-3 w-full px-2">

      <!-- 搜索图标 (激活状态：浅绿色背景，绿色图标) -->
      <button class="flex items-center justify-center w-10 h-10 mx-auto rounded-md bg-[#e8f5e9] text-[#10b981] transition-colors">
        <i data-lucide="search" class="w-[22px] h-[22px]"></i>
      </button>

      <!-- 下载图标 (带红色角标) -->
      <button class="relative flex items-center justify-center w-10 h-10 mx-auto rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-700 transition-colors group">
        <i data-lucide="download" class="w-[22px] h-[22px]"></i>
        <!-- 红色小角标 -->
        <span class="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 border border-[#f4f4f5]"></span>
        </span>
      </button>

      <!-- 用户图标 -->
      <button class="flex items-center justify-center w-10 h-10 mx-auto rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-700 transition-colors">
        <i data-lucide="user" class="w-[22px] h-[22px]"></i>
      </button>

    </nav>

    <!-- 底部图标 -->
    <div class="mt-auto flex flex-col gap-3 w-full px-2">
      <!-- 亮度调节 -->
      <button class="flex items-center justify-center w-10 h-10 mx-auto rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-700 transition-colors">
        <i data-lucide="sun" class="w-5 h-5"></i>
      </button>
      <!-- 设置 -->
      <button class="flex items-center justify-center w-10 h-10 mx-auto rounded-md text-zinc-500 hover:bg-zinc-200 hover:text-zinc-700 transition-colors">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </aside>

  <!-- ================= 主内容区 ================= -->
  <main class="flex-1 h-full flex flex-col relative">

    <!-- 顶部窗口控制装饰 (模拟 Windows 风格) -->
    <div class="h-8 w-full flex justify-end items-center px-1 shrink-0">
      <button class="w-11 h-8 flex items-center justify-center text-zinc-500 hover:bg-zinc-100 transition-colors">
        <i data-lucide="minus" class="w-4 h-4"></i>
      </button>
      <button class="w-11 h-8 flex items-center justify-center text-zinc-500 hover:bg-zinc-100 transition-colors">
        <i data-lucide="square" class="w-3.5 h-3.5"></i>
      </button>
      <button class="w-11 h-8 flex items-center justify-center text-zinc-500 hover:bg-red-500 hover:text-white transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- 居中搜索区域 -->
    <div class="flex-1 flex items-center justify-center pb-20">

      <!-- 搜索框容器 -->
      <div class="flex items-center w-full max-w-[500px] border border-zinc-300 rounded-md p-1 bg-white hover:border-zinc-400 focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all shadow-sm">

        <!-- 输入框 -->
        <input
          type="text"
          placeholder="请输入链接"
          class="flex-1 h-10 px-3 bg-transparent outline-none text-[15px] placeholder:text-zinc-400 text-zinc-700"
        >

        <!-- 搜索按钮 -->
        <button class="h-10 px-6 bg-[#10b981] hover:bg-[#059669] active:bg-[#047857] text-white text-[14px] font-medium rounded transition-colors flex items-center justify-center">
          搜索
        </button>

      </div>

    </div>
  </main>

  <!-- 初始化 Lucide 图标 -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
